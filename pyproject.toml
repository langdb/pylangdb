[project]
name = "pylangdb"
version = "0.2.6"
description = "Multi-Framework AI Agent Tracing and Client. Instrument, trace, and analyze agents and LLMs across Google ADK, OpenAI, LangChain, CrewAI, and Agno with seamless distributed tracing and analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.18.0",
    "opentelemetry-sdk>=1.18.0",
    "opentelemetry-exporter-otlp>=1.18.0",
    "uuid>=1.0.0"
]

[project.optional-dependencies]
# Client library extras
adk = [
    "google-adk>=1.5.0",
]
agno = [
    "agno>=1.7.0",
    "openinference-instrumentation-agno>=0.1.7",
]
crewai = [
    "openinference-instrumentation-crewai>=0.1.1",
    "litellm>=1.73.2",
]
langchain = [
    "openinference-instrumentation-langchain>=0.1.43",
]
openai = [
    "openai>=1.60.2",
    "openinference-instrumentation-openai-agents>=0.1.14",
]
client = [
    "pandas>=2.2.2",
    "requests>=2.32.3",
    "openai>=1.60.2",
    "python-dotenv>=1.0.1",
]
# All dependencies
all = [
    "agno>=1.7.0",
    "google-adk>=1.5.0",
    "litellm>=1.73.2",
    "openai>=1.60.2",
    "openinference-instrumentation-openai-agents>=0.1.14",
    "openinference-instrumentation-agno>=0.1.7",
    "openinference-instrumentation-crewai>=0.1.1",
    "openinference-instrumentation-langchain>=0.1.43",
]
